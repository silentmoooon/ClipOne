acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 存储记录精简且无冗余字段 - WHEN ClipOne 保存新增普通文本或状态条目至 events.jsonl - THEN
      生成的 JSON 文本行中不再包含
      DeviceId、IsDeleted:false、DeleteTimestamp:0、NeedOverride:false 以及多余的空字符串 -
      AND 重新加载时条目数据完整有效。"
    result: passed
    reason:
      text: 属性级别条件忽略生效，无冗余字段输出，目录推断反序列化恢复完整
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 图片存储与日志完全解耦 - WHEN 用户复制图片并触发剪贴板存储 - THEN 图片二进制被保存到
      data/assets/{id}.bmp，events.jsonl 中该记录仅保存相对文件路径 - AND 该记录在 events.jsonl
      中体积由几兆字节缩小为几十字节 - AND 前端能通过 asset:// 正常渲染预览，点击或快捷键粘贴能完整恢复至系统剪贴板。"
    result: passed
    reason:
      text: 二进制写入独立资产文件，日志仅存相对路径，asset:// 协议与剪贴板写入均闭环
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 清理与 Compaction 联动回收资源 - WHEN 执行 ClearHistory 或 Compaction 触发瘦身
      - THEN 废弃的资产图片文件被物理清理，不会在磁盘留下孤立无用的大文件。"
    result: passed
    reason:
      text: ClearHistory 物理清空 assets 目录，Compaction 准确回收孤立垃圾文件
      truncated: false
  - id: A4
    source: specs/trim-storage/spec.md
    text: "存储记录精简且无冗余字段 GIVEN ClipModel 准备保存到 events.jsonl WHEN 执行序列化 THEN 输出的 JSON
      文本中完全不包含 DeviceId 属性 AND 默认属性（IsDeleted: false, DeleteTimestamp: 0,
      NeedOverride: false, PlainText 为空等）被条件忽略省略 AND 当从文件读取反序列化时，由所属父目录名赋值给内存中的
      DeviceId 属性，其余默认值正确初始化"
    result: passed
    reason:
      text: 与 A1 规格一致，完全满足 GIVEN / WHEN / THEN 契约
      truncated: false
  - id: A5
    source: specs/trim-storage/spec.md
    text: 图片存储与日志完全解耦 GIVEN 用户在系统内复制图片并生成图片记录（Type 为 image） WHEN StorageService
      处理该条目 THEN 图片二进制被持久化为 data/assets/{id}.bmp 文件 AND 该记录在 events.jsonl
      中仅保存相对路径（如 assets/{id}.bmp），不再内联数兆字节的 Base64 字符串 AND 前端通过 asset://
      协议流式获取图片并正常渲染预览 AND 用户点击或快捷键粘贴该条目时，ClipService 正确读取该图片并无损写入 Windows 剪贴板
    result: passed
    reason:
      text: 与 A2 规格一致，完全满足 GIVEN / WHEN / THEN 契约
      truncated: false
  - id: A6
    source: specs/trim-storage/spec.md
    text: 清理与 Compaction 联动回收资源 GIVEN data/assets 目录中保存了若干图片资产文件 WHEN
      用户执行清空（ClearHistory）或日志 Compaction 淘汰了旧记录 THEN
      对应的资产图片文件被物理删除回收，避免在磁盘留下孤立无用的大文件
    result: passed
    reason:
      text: 与 A3 规格一致，完全满足 GIVEN / WHEN / THEN 契约
      truncated: false
