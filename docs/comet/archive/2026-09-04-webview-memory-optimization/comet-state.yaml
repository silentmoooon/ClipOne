acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 后台静默时自动修剪进程工作集内存 - GIVEN ClipOne 与 WebView2 正在运行且窗口处于隐藏状态 -
      WHEN 窗口隐藏超过空闲延迟阈值（如 3 秒） - THEN ClipOne 主进程及关联的 msedgewebview2.exe
      进程物理工作集内存（Working Set）被自动修剪，总物理内存占用大幅下降至 30MB
      以下，且按快捷键唤出窗口时仍能毫秒级即时展示且无白屏或闪烁"
    result: passed
    reason:
      text: 后台静默 3 秒后延迟修剪主进程与子进程工作集，唤起时取消定时器，GC 先行，Chromium 参数精简
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 前端列表按需分批渲染 - GIVEN 剪贴板历史中存在多条记录（最多 300 条） - WHEN 用户打开剪贴板窗口或搜索过滤
      - THEN 前端优先渲染可见视口及首屏条目（如 25 条），随滚动接近底部时自动追加渲染后续条目，避免一次性生成上千个 DOM 节点与显存纹理"
    result: passed
    reason:
      text: 前端首屏分批渲染 25 条，滚动近底 loadMore，上下按键越界自动扩充，hide 时恢复 25 条并调用 window.gc
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 粘贴与设置剪贴板基于 ID 交互 - GIVEN 用户在前端选中某条历史记录并触发粘贴或复制 - WHEN 前端向 C#
      宿主发送 IPC 消息 - THEN 前端仅发送条目 Id，C# 宿主根据 Id 从本地存储中检索完整数据并写入系统剪贴板，彻底杜绝大文本在 IPC
      与 V8 堆中的全量序列化往返"
    result: passed
    reason:
      text: 前端仅发送条目 Id，C# 后端通过 GetClipById 检索完整原数据写入剪贴板，BatchPaste 浅拷贝无污染，GetWebClip
        截断超大内容
      truncated: false
  - id: A4
    source: specs/webview-memory-optimization/spec.md
    text: 后台静默时自动修剪进程工作集内存 GIVEN ClipOne 与 WebView2 正在运行且窗口处于隐藏状态 WHEN
