<!DOCTYPE html>
<html>

<head>
    <title></title>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="css/common.css" />
    <script type="text/javascript" src="js/jquery-3.3.1.min.js" charset="UTF-8"></script>
    <script type="text/javascript" src="js/wechat_emojis.js" charset="UTF-8"></script>
    <script type="text/javascript" src="js/main.js" charset="UTF-8"></script>
</head>

<body>


    <div id="searchDiv" style="display:none;">
        <input id="searchInput" placeholder="查找" aria-label="查找" />
    </div>
    <div class="content">

        <table id="table_main" class="table_main">
            <tbody class="myTable" style="cursor: default"></tbody>
        </table>
    </div>

    <!-- 现代 Web 托盘菜单 -->
    <div id="trayMenuModal" class="tray-menu-modal" style="display:none;">
        <div class="tray-menu-container">
            <div class="tray-menu-item" data-action="clear">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12Z"/></svg>
                <span class="tray-text">清空</span>
            </div>
            <div class="tray-menu-item" data-action="reload">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
                <span class="tray-text">刷新</span>
            </div>
            <div class="tray-divider"></div>
            <div class="tray-menu-item has-submenu" id="trayItemSkin">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span class="tray-text">皮肤</span>
                <svg class="tray-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
            <div class="tray-submenu" id="skinSubmenu" style="display:none;"></div>
            <div class="tray-menu-item has-submenu" id="trayItemTheme">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 0 1 0-16v16z"/></svg>
                <span class="tray-text">主题模式</span>
                <svg class="tray-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
            <div class="tray-submenu" id="themeSubmenu" style="display:none;">
                <div class="tray-menu-item tray-sub-item" data-action="setTheme|System">
                    <span class="tray-radio-indicator" id="radioThemeSystem"></span>
                    <span class="tray-text">跟随系统</span>
                </div>
                <div class="tray-menu-item tray-sub-item" data-action="setTheme|Light">
                    <span class="tray-radio-indicator" id="radioThemeLight"></span>
                    <span class="tray-text">浅色</span>
                </div>
                <div class="tray-menu-item tray-sub-item" data-action="setTheme|Dark">
                    <span class="tray-radio-indicator" id="radioThemeDark"></span>
                    <span class="tray-text">深色</span>
                </div>
            </div>
            <div class="tray-menu-item" data-action="openHotkey">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
                <span class="tray-text">热键设置</span>
            </div>
            <div class="tray-menu-item" data-action="toggleStartup">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5s3.5 3.5 3.5 7.5c0 1.5-.5 3-1.5 4.5l3.5 3.5-1.5 1.5-3.5-3.5c-1.5 1-3 1.5-4.5 1.5-4 0-7.5-3.5-7.5-3.5s3.5-3.5 7.5-3.5c1.5 0 3 .5 4.5 1.5L9 12c-1-1-1.5-2.5-1.5-4 0-4 4.5-5.5 4.5-5.5zM12 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                <span class="tray-text">开机自启</span>
                <span class="tray-check-indicator" id="trayStartupCheck"></span>
            </div>
            <div class="tray-divider"></div>
            <div class="tray-menu-item" data-action="toggleDevTools">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                <span class="tray-text">开发者工具</span>
            </div>
            <div class="tray-menu-item" data-action="exit">
                <svg class="tray-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                <span class="tray-text">退出</span>
            </div>
        </div>
    </div>

    <div id="hotkeyModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#2b2b2b; color:#f0f0f0; border-radius:8px; padding:16px; width:260px; box-shadow:0 6px 20px rgba(0,0,0,0.5); font-family: 'Segoe UI', sans-serif;">
            <h4 style="margin:0 0 12px 0; font-size:14px; font-weight:600; text-align:center;">设置唤醒热键</h4>
            <div style="display:flex; justify-content:space-around; margin-bottom:12px;">
                <label style="display:flex; align-items:center; gap:2px; font-size:12px; cursor:pointer;"><input type="checkbox" id="hkWin" value="8" /> Win</label>
                <label style="display:flex; align-items:center; gap:2px; font-size:12px; cursor:pointer;"><input type="checkbox" id="hkAlt" value="1" /> Alt</label>
                <label style="display:flex; align-items:center; gap:2px; font-size:12px; cursor:pointer;"><input type="checkbox" id="hkCtrl" value="2" /> Ctrl</label>
                <label style="display:flex; align-items:center; gap:2px; font-size:12px; cursor:pointer;"><input type="checkbox" id="hkShift" value="4" /> Shift</label>
            </div>
            <div style="margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:8px;">
                <span style="font-size:12px;">字母键:</span>
                <select id="hkKeySelect" style="padding:3px 8px; border-radius:4px; font-size:12px; background:#3a3a3a; color:#fff; border:1px solid #555;"></select>
            </div>
            <div style="display:flex; justify-content:center; gap:12px;">
                <button id="btnCancelHotkey" style="padding:4px 14px; border-radius:4px; border:1px solid #666; background:#444; color:#fff; cursor:pointer; font-size:12px;">取消</button>
                <button id="btnSaveHotkey" style="padding:4px 16px; border-radius:4px; border:none; background:#0078d4; color:#fff; cursor:pointer; font-size:12px;">保存</button>
            </div>
        </div>
    </div>
</body>

</html>
<link rel="stylesheet" type="text/css" href="css/stand/stand.css" />
