name: Build and Publish Native AOT

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ClipOne.csproj

    - name: Publish Native AOT (Full Trimmed)
      run: dotnet publish ClipOne.csproj -c Release -r win-x64 -o publish_output

    - name: Create Zip Archive
      run: Compress-Archive -Path publish_output\* -DestinationPath ClipOne_Portable_AOT.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClipOne-Portable-AOT-win-x64
        path: ClipOne_Portable_AOT.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ClipOne_Portable_AOT.zip
        draft: false
        prerelease: false
        generate_release_notes: true
