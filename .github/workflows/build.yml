name: Build and Publish

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ClipOne.sln

    - name: Build
      run: dotnet build ClipOne.sln -c Release --no-restore

    - name: Publish Green Version
      run: dotnet publish ClipOne.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish_output

    - name: Create Zip Archive
      run: Compress-Archive -Path publish_output\* -DestinationPath ClipOne_Portable_Green.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClipOne-Portable-Green
        path: ClipOne_Portable_Green.zip

