name: Build and Publish

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ClipOne.sln

    - name: Build
      run: dotnet build ClipOne.sln -c Release --no-restore

    - name: Publish
      run: dotnet publish ClipOne.csproj -c Release -o publish_output

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClipOne-Release
        path: publish_output/

